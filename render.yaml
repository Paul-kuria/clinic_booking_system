databases:
  - name: clinic-postgres
    databaseName: clinic_db
    user: clinic_user
    plan: free

services:
  - type: web
    name: clinic-booking-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clinic-postgres
          property: connectionString
      - key: CLINIC_TIMEZONE
        value: Africa/Nairobi
      - key: ENVIRONMENT
        value: production
