[project]
name = "techsavannah-backend"
version = "0.1.0"
description = "Clinic Booking System Backend API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.13.0",
    "fastapi>=0.110.0",
    "psycopg2-binary>=2.9.9",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.28.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
